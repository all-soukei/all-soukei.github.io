media:
  input: images
  output: /images
  rename: safe
  extensions: [jpg, JPG, jpeg, JPEG, png, PNG, webp, WEBP]

content:

  # =========================
  # 記事
  # =========================

  - name: articles
    label: 記事
    type: collection
    path: _articles
    format: yaml-frontmatter

    filename:
      template: "{slug}.md"
      field: create

    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:

      - name: title
        label: 記事タイトル
        type: text
        required: true

      - name: date
        label: 公開日
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd

      - name: category
        label: 大学・カテゴリー
        type: select
        required: true
        options:
          values:
            - name: WASEDA
              label: 早稲田大学
            - name: KEIO
              label: 慶應義塾大学
            - name: SPECIAL
              label: SPECIAL

      - name: description
        label: 記事の説明
        type: text
        required: false

      - name: image
        label: メイン画像
        type: image
        required: false
        options:
          extensions: [jpg, JPG, jpeg, JPEG, png, PNG, webp, WEBP]

      - name: pickup
        label: PICK UPに表示
        type: boolean
        default: false

      - name: body
        label: 本文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false


  # =========================
  # トップページ設定
  # =========================

  - name: home
    label: トップページ設定
    type: file
    path: _data/home.yml
    format: yaml

    operations:
      delete: false

    fields:

      - name: next_date
        label: NEXT CONTENT 公開予定日
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd

      - name: next_title
        label: NEXT CONTENT タイトル
        type: string
        required: true

      - name: next_description
        label: NEXT CONTENT 説明
        type: text
        required: false

      - name: next_status
        label: 表示テキスト
        type: string
        required: true
        default: COMING SOON
